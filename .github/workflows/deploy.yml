name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # O painel publica no banco da Raposa (Supabase). De 15 em 15 minutos este
  # roteiro confere o banco e, se houver novidade, guarda o conteúdo no
  # repositório e reconstrói as páginas. Sem novidade, para no primeiro passo.
  schedule:
    - cron: '*/15 * * * *'

# Um deploy de cada vez: se duas publicações vierem seguidas, a segunda
# espera a primeira em vez de cancelar no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sim: ${{ steps.decidir.outputs.sim }}
    steps:
      - uses: actions/checkout@v4
      - id: banco
        if: github.event_name == 'schedule'
        run: node scripts/puxar-conteudo.mjs --checar
      - id: decidir
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.banco.outputs.mudou }}" = "true" ]; then
            echo "sim=true" >> "$GITHUB_OUTPUT"
          else
            echo "sim=false" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: checar
    if: needs.checar.outputs.sim == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # o prebuild puxa o conteúdo do banco antes de montar as páginas
      - run: npm run build
        env:
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          NEXT_PUBLIC_PLAUSIBLE_HOST: ${{ vars.PLAUSIBLE_HOST }}
      # guarda no repositório o conteúdo que veio do banco (cópia de segurança
      # e histórico); o commit do próprio GitHub não dispara outra rodada
      - if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- src/data/site-content.json; then
            git config user.name "raposa-painel"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/site-content.json
            git commit -m "Conteúdo publicado pelo painel (do banco)"
            git push
          fi
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4
